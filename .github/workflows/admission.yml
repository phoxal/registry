# Registry admission: integrity checks, ownership authorization, a readable
# source report, and auto-merge enablement for eligible publication PRs.
#
# The pull_request event runs THIS file from the base branch, so the policy
# a submission is measured against is always the trusted one. Package
# archives are parsed, never executed. Deferred antivirus and malware
# analysis appear as visibly skipped placeholders that never claim a scan
# passed.
name: admission

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: admission-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

env:
  PR_NUMBER: ${{ github.event.pull_request.number }}
  BASE_SHA: ${{ github.event.pull_request.base.sha }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  AUTHOR: ${{ github.event.pull_request.user.login }}

jobs:
  admission:
    name: admission
    runs-on: ubuntu-latest
    outputs:
      eligible: ${{ steps.eligibility.outputs.eligible }}
    steps:
      - name: Check out the submission head
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          fetch-depth: 0
          path: pr

      - name: Check out the base branch policy tree
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_SHA }}
          path: base

      - name: Validate admission
        id: validate
        run: |
          python3 pr/scripts/admission.py \
            --repo pr \
            --base-root base \
            --base-ref "$BASE_SHA" \
            --author "$AUTHOR" \
            --summary summary.md \
            --report report.md \
            --eligible-out eligible.txt
          cat summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Record auto-merge eligibility
        id: eligibility
        run: echo "eligible=$(cat eligible.txt)" >> "$GITHUB_OUTPUT"

      - name: Antivirus scan (deferred — not a check)
        run: |
          echo "Antivirus scan: NOT IMPLEMENTED / NOT SCANNED."
          echo "This step records deferred coverage; it is not evidence of any scan."
          {
            echo "### Antivirus scan: NOT IMPLEMENTED / NOT SCANNED"
            echo "No antivirus product runs on submitted archives. This admission"
            echo "establishes publisher authorization and package integrity only."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Malware analysis (deferred — not a check)
        run: |
          echo "Malware analysis: NOT IMPLEMENTED / NOT SCANNED."
          echo "This step records deferred coverage; it is not evidence of any analysis."
          {
            echo "### Malware analysis: NOT IMPLEMENTED / NOT SCANNED"
            echo "No static or dynamic malware analysis runs on submitted archives."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dependency audit from published lockfiles
        continue-on-error: true
        run: |
          mkdir -p audit
          python3 - <<'PY' || true
          import io, os, subprocess, tarfile
          from pathlib import Path
          changed = subprocess.run(
              ["git", "-C", "pr", "diff", "--name-only", "--diff-filter=ACMR",
               os.environ["BASE_SHA"], "HEAD"],
              capture_output=True, text=True, check=True).stdout.splitlines()
          archives = [p for p in changed if p.startswith("crates/") and p.endswith(".crate")]
          for index, relative in enumerate(archives):
              blob = Path("pr", relative).read_bytes()
              with tarfile.open(fileobj=io.BytesIO(blob), mode="r:*") as archive:
                  member = next((m for m in archive.getmembers()
                                 if m.name.endswith("/Cargo.lock")), None)
                  if member is None:
                      print(f"{relative}: no Cargo.lock in the archive; audit coverage unavailable")
                      continue
                  Path(f"audit/{index}.lock").write_bytes(archive.extractfile(member).read())
          PY
          if compgen -G "audit/*.lock" > /dev/null; then
            curl -sSfL https://github.com/rustsec/rustsec/releases/latest/download/cargo-audit-*-x86_64-unknown-linux-musl.tar.gz \
              | tar xz --strip-components=1 -C "$HOME"
            for lock in audit/*.lock; do
              echo "== $lock"
              "$HOME/cargo-audit" audit --file "$lock" || true
            done
          else
            echo "No published lockfiles to audit; dependency audit coverage unavailable."
          fi
          {
            echo "### Dependency audit"
            echo "cargo-audit ran against every submitted archive's own Cargo.lock (findings"
            echo "above, reported but not gating). Archives without a lockfile have no audit"
            echo "coverage. This is a dependency advisory listing, not malware scanning:"
            echo "antivirus/malware coverage remains NOT IMPLEMENTED / NOT SCANNED."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the source report
        uses: actions/upload-artifact@v4
        with:
          name: source-report-${{ env.PR_NUMBER }}
          path: |
            summary.md
            report.md
          if-no-files-found: error

  request-auto-merge:
    name: request-auto-merge
    needs: admission
    if: needs.admission.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read
    steps:
      - name: Enable auto-merge for this eligible submission
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --auto --squash \
            --subject "${HEAD_SHA:0:10} verified registry publication"
          echo "Auto-merge requested; GitHub merges once the required checks pass on this head."
