# Registry admission: integrity checks, ownership authorization, a readable
# source report, and verified merging for eligible publication PRs.
#
# Trust boundary: this workflow always runs the BASE branch's definition
# through the pull_request_target event, and the validator it executes is
# always the base branch's copy. The pull request tree is checked out as
# untrusted DATA and parsed — never executed. Untrusted archive handling
# carries no write credentials; only the merge step, which touches no
# package bytes, holds write authority, and it merges exactly the head
# that admission validated.
#
# Deferred antivirus and malware analysis appear as visibly skipped
# placeholders that never claim a scan passed.
name: admission

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: admission-${{ github.event.pull_request.head.sha }}
  cancel-in-progress: true

env:
  PR_NUMBER: ${{ github.event.pull_request.number }}
  BASE_SHA: ${{ github.event.pull_request.base.sha }}
  HEAD_SHA: ${{ github.event.pull_request.head.sha }}
  AUTHOR: ${{ github.event.pull_request.user.login }}

jobs:
  admission:
    name: admission
    runs-on: ubuntu-latest
    outputs:
      eligible: ${{ steps.eligibility.outputs.eligible }}
    steps:
      - name: Check out the trusted base policy tree
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BASE_SHA }}
          path: base

      - name: Check out the submission head as data
        uses: actions/checkout@v4
        with:
          ref: ${{ env.HEAD_SHA }}
          path: pr
          fetch-depth: 0
          persist-credentials: false

      - name: Validate admission with the base validator
        id: validate
        run: |
          python3 base/scripts/admission.py \
            --repo pr \
            --base-root base \
            --base-ref "$BASE_SHA" \
            --author "$AUTHOR" \
            --summary summary.md \
            --report report.md \
            --eligible-out eligible.txt
          cat summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Record auto-merge eligibility
        id: eligibility
        run: echo "eligible=$(cat eligible.txt)" >> "$GITHUB_OUTPUT"

      - name: Antivirus scan (deferred — not a check)
        run: |
          echo "Antivirus scan: NOT IMPLEMENTED / NOT SCANNED."
          echo "This step records deferred coverage; it is not evidence of any scan."
          {
            echo "### Antivirus scan: NOT IMPLEMENTED / NOT SCANNED"
            echo "No antivirus product runs on submitted archives. This admission"
            echo "establishes publisher authorization and package integrity only."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Malware analysis (deferred — not a check)
        run: |
          echo "Malware analysis: NOT IMPLEMENTED / NOT SCANNED."
          echo "This step records deferred coverage; it is not evidence of any analysis."
          {
            echo "### Malware analysis: NOT IMPLEMENTED / NOT SCANNED"
            echo "No static or dynamic malware analysis runs on submitted archives."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Dependency audit from published lockfiles
        continue-on-error: true
        run: |
          set -euo pipefail
          mkdir -p audit
          python3 - <<'PY'
          import io, os, subprocess, tarfile
          from pathlib import Path
          changed = subprocess.run(
              ["git", "-C", "pr", "diff", "--name-only", "--diff-filter=ACMR",
               os.environ["BASE_SHA"], "HEAD"],
              capture_output=True, text=True, check=True).stdout.splitlines()
          found = 0
          for index, relative in enumerate(
              p for p in changed if p.startswith("crates/") and p.endswith(".crate")
          ):
              blob = Path("pr", relative).read_bytes()
              with tarfile.open(fileobj=io.BytesIO(blob), mode="r:*") as archive:
                  member = next((m for m in archive.getmembers()
                                 if m.name.endswith("/Cargo.lock")), None)
                  if member is None:
                      print(f"{relative}: no Cargo.lock in the archive; audit coverage unavailable")
                      continue
                  Path(f"audit/{index}.lock").write_bytes(archive.extractfile(member).read())
                  found += 1
          Path("audit-count").write_text(str(found))
          PY
          {
            echo "### Dependency audit"
            if [ "$(cat audit-count)" -gt 0 ]; then
              echo "Installing cargo-audit 0.22.2 (established installer, pinned)."
              curl -fsSL \
                "https://api.github.com/repos/rustsec/rustsec/releases/tags/cargo-audit-v0.22.2" \
                >/dev/null
              cargo install cargo-audit --version 0.22.2 --locked
              for lock in audit/*.lock; do
                echo "== $lock"
                cargo audit --file "$lock" || true
              done
              echo "cargo-audit 0.22.2 ran against every submitted archive that"
              echo "carries its own Cargo.lock; findings are reported above and do"
              echo "not gate admission. This is a dependency advisory listing, not"
              echo "malware scanning: antivirus/malware coverage remains"
              echo "NOT IMPLEMENTED / NOT SCANNED."
            else
              echo "No submitted archive carries a Cargo.lock; dependency audit"
              echo "coverage was unavailable for this pull request (nothing ran)."
              echo "Antivirus/malware coverage remains NOT IMPLEMENTED / NOT SCANNED."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload the source report
        uses: actions/upload-artifact@v4
        with:
          name: source-report-${{ env.PR_NUMBER }}
          path: |
            summary.md
            report.md
          if-no-files-found: error

  merge-eligible:
    name: merge eligible submission
    needs: admission
    if: needs.admission.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: write
    steps:
      - name: Wait for the required checks on this exact head
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr checks "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --watch --interval 15
      - name: Merge exactly the validated head
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr merge "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --squash \
            --match-head-commit "$HEAD_SHA" \
            --subject "verified registry publication ($HEAD_SHA)"
