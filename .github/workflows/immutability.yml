name: immutability

# A published version is never overwritten, re-uploaded, or removed: the git
# history of this repository is the audit trail for what the framework shipped,
# and that only means something if history is append-only.
#
# This job checks CONTENT. History itself is protected separately by the
# `append-only history` repository ruleset, which blocks force-pushes and
# deletion of the default branch - a workflow runs after a push and cannot
# undo one.
#
# Known limits, deliberately recorded rather than implied away:
#   * This runs after `main` has already moved. It detects a bad push; the
#     ruleset is what prevents the branch being rewritten afterwards.
#   * The workflow file lives in this repository, so a change to it is a change
#     to its own guard. Review `.github/**` diffs accordingly.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  append-only:
    name: published versions are immutable
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Determine the range to inspect
        id: range
        shell: bash
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" == "pull_request" ]]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi

          # Fail closed. A missing, unreachable, or non-ancestor base means the
          # push cannot be judged - never fall back to `head^`, which would let
          # anything already placed in the first parent through unexamined.
          if [[ -z "$base" || "$base" == "0000000000000000000000000000000000000000" ]]; then
            echo "::error::no base commit for this push; refusing to pass unverified"
            exit 1
          fi
          if ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "::error::base $base is not present; history may have been rewritten"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$base" "$head"; then
            echo "::error::base $base is not an ancestor of $head; this is not a fast-forward"
            exit 1
          fi

          echo "base=$base" >> "$GITHUB_OUTPUT"
          echo "head=$head" >> "$GITHUB_OUTPUT"

      - name: Verify every introduced commit is append-only
        shell: bash
        env:
          BASE: ${{ steps.range.outputs.base }}
          HEAD: ${{ steps.range.outputs.head }}
        run: |
          set -euo pipefail
          python3 .github/scripts/check_append_only.py "$BASE" "$HEAD"
